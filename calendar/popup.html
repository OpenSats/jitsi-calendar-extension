<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Jitsi Meetings</title>
    <script defer src="popup.js"></script>
    <style>
        body { width: 230px; margin: 6px; font: 14px/1.4 system-ui, sans-serif; }
        a, button { box-sizing: border-box; display: block; width: 100%; border: 0;
            background: transparent; color: inherit; text-decoration: none; cursor: pointer;
            padding: 8px 10px; text-align: start; font: inherit; border-radius: 4px; }
        :is(a, button):hover { background: #e8eef7; }
    </style>
</head>
<body>
    <a id="create" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;autoCreateMeeting=true" target="_blank" rel="noopener">Create Google Calendar meeting</a>
    <button type="button" id="settings">Settings</button>
</body>
</html>
